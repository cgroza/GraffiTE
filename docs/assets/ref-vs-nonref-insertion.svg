<svg viewBox="0 0 780 366" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="rnr-title rnr-desc" class="gt-figure">
  <title id="rnr-title">Reference versus non-reference transposable element insertions</title>
  <desc id="rnr-desc">Two panels. Left: a non-reference insertion, where the transposable element
  is absent from the reference genome and present in the sample haplotype, producing a VCF record
  with SVTYPE equal to INS. Right: a reference insertion, where the element is present in the
  reference and absent from the sample, producing a VCF record with SVTYPE equal to DEL. In both
  cases the annotated element is the same transposable element.</desc>
  <style>
    .gt-figure { --fg: var(--md-default-fg-color, #1f2933);
                 --fg-mute: var(--md-default-fg-color--light, #5b6b7c);
                 --fg-faint: var(--md-default-fg-color--lightest, #d3dae1);
                 --te: var(--gt-coral, #f2523f);
                 --flank: var(--md-default-fg-color--lightest, #dfe5ea);
                 --rule: var(--md-default-fg-color--lighter, #b6c2cd);
                 --panel: var(--md-code-bg-color, rgba(128,140,155,.09)); }
    .gt-figure text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .ttl   { font-size: 15px; font-weight: 700; fill: var(--fg); }
    .lbl   { font-size: 12px; font-weight: 600; fill: var(--fg-mute);
             letter-spacing: .04em; text-transform: uppercase; }
    .blk   { font-size: 12.5px; font-weight: 600; fill: var(--fg-mute); }
    .te-t  { font-size: 12.5px; font-weight: 700; fill: #fff; }
    .mono  { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
             font-size: 12px; fill: var(--fg); }
    .cap   { font-size: 12.5px; fill: var(--fg-mute); }
    .flank { fill: var(--flank); stroke: var(--rule); stroke-width: 1; }
    .te    { fill: var(--te); }
    .panel { fill: var(--panel); stroke: var(--rule); stroke-width: 1; }
    .gap   { stroke: var(--rule); stroke-width: 1.5; stroke-dasharray: 4 3; }
    .tick  { stroke: var(--te); stroke-width: 1.5; }
  </style>
  <!-- ══════════════ LEFT PANEL · non-reference insertion ══════════════ -->
  <g transform="translate(0,0)">
    <rect class="panel" x="1" y="1" width="372" height="330" rx="8"/>
    <text class="ttl" x="20" y="30">Non-reference insertion</text>
    <text class="cap" x="20" y="50">The element is absent from the reference.</text>
    <!-- reference track: uninterrupted -->
    <text class="lbl" x="20" y="83">Reference</text>
    <rect class="flank" x="20" y="92" width="150" height="30" rx="4"/>
    <rect class="flank" x="170" y="92" width="150" height="30" rx="4"/>
    <text class="blk" x="95"  y="112" text-anchor="middle">flank</text>
    <text class="blk" x="245" y="112" text-anchor="middle">flank</text>
    <line class="tick" x1="170" y1="86" x2="170" y2="128"/>
    <!-- sample track: element inserted -->
    <text class="lbl" x="20" y="163">Sample</text>
    <rect class="flank" x="20"  y="172" width="105" height="30" rx="4"/>
    <rect class="te"    x="125" y="172" width="110" height="30" rx="4"/>
    <rect class="flank" x="235" y="172" width="105" height="30" rx="4"/>
    <text class="blk"  x="72"  y="192" text-anchor="middle">flank</text>
    <text class="te-t" x="180" y="192" text-anchor="middle">TE</text>
    <text class="blk"  x="287" y="192" text-anchor="middle">flank</text>
    <!-- linkage between the two tracks -->
    <path class="gap" d="M170 128 L125 166"/>
    <path class="gap" d="M170 128 L235 166"/>
    <!-- record -->
    <rect class="panel" x="20" y="228" width="333" height="84" rx="6"/>
    <text class="mono" x="34" y="252">REF = <tspan fill="var(--fg-mute)">A</tspan></text>
    <text class="mono" x="34" y="272">ALT = <tspan fill="var(--fg-mute)">A</tspan> + <tspan fill="var(--te)" font-weight="700">TE</tspan></text>
    <text class="mono" x="34" y="296">SVTYPE = <tspan font-weight="700">INS</tspan></text>
    <text class="cap"  x="200" y="296">TE present in sample</text>
  </g>
  <!-- ══════════════ RIGHT PANEL · reference insertion ══════════════ -->
  <g transform="translate(406,0)">
    <rect class="panel" x="1" y="1" width="372" height="330" rx="8"/>
    <text class="ttl" x="20" y="30">Reference insertion</text>
    <text class="cap" x="20" y="50">The element is present in the reference.</text>
    <!-- reference track: element present -->
    <text class="lbl" x="20" y="83">Reference</text>
    <rect class="flank" x="20"  y="92" width="105" height="30" rx="4"/>
    <rect class="te"    x="125" y="92" width="110" height="30" rx="4"/>
    <rect class="flank" x="235" y="92" width="105" height="30" rx="4"/>
    <text class="blk"  x="72"  y="112" text-anchor="middle">flank</text>
    <text class="te-t" x="180" y="112" text-anchor="middle">TE</text>
    <text class="blk"  x="287" y="112" text-anchor="middle">flank</text>
    <!-- sample track: uninterrupted -->
    <text class="lbl" x="20" y="163">Sample</text>
    <rect class="flank" x="20"  y="172" width="150" height="30" rx="4"/>
    <rect class="flank" x="170" y="172" width="150" height="30" rx="4"/>
    <text class="blk" x="95"  y="192" text-anchor="middle">flank</text>
    <text class="blk" x="245" y="192" text-anchor="middle">flank</text>
    <line class="tick" x1="170" y1="166" x2="170" y2="208"/>
    <path class="gap" d="M125 128 L170 166"/>
    <path class="gap" d="M235 128 L170 166"/>
    <rect class="panel" x="20" y="228" width="333" height="84" rx="6"/>
    <text class="mono" x="34" y="252">REF = <tspan fill="var(--fg-mute)">A</tspan> + <tspan fill="var(--te)" font-weight="700">TE</tspan></text>
    <text class="mono" x="34" y="272">ALT = <tspan fill="var(--fg-mute)">A</tspan></text>
    <text class="mono" x="34" y="296">SVTYPE = <tspan font-weight="700">DEL</tspan></text>
    <text class="cap"  x="200" y="296">TE absent from sample</text>
  </g>
  <!-- ══════════════ footer ══════════════ -->
  <text class="cap" x="390" y="356" text-anchor="middle">
    In both panels GraffiTE annotates the same element, but the ALT allele means
    <tspan font-weight="700" fill="var(--fg)">“TE present”</tspan> only on the left.
  </text>
</svg>
